# Menapoly Cue private pilot: manual, owner-approved, fail-closed. Never runs on push, pull request or schedule.
#
# Run it from the GitHub app or github.com on your phone: Actions → "Menapoly Cue pilot" → Run workflow →
# branch menapoly-cue-2.0, choose the action and type its phrase exactly (docs/cloud/pilot/phone-only.md).
#
# Protection, in order:
#  1. gate: must be the menapoly-cue-2.0 branch and the typed phrase must match the action (no secrets in this job).
#  2. environment "menapoly-cue-pilot": GitHub pauses until the owner approves (required reviewer), and only the
#     menapoly-cue-2.0 branch may use it (deployment branch rule). All Cloudflare credentials live only there.
#  3. preflight (read-only, fails closed): Relay deploy workflows disabled, zone active in the account, Access apps
#     present with no public/Everyone/IP policies, AUD and team domain match the secrets.
#  4. deploy carries the Access settings in the first version; an after-deploy probe must see every unauthenticated
#     request redirected to Access or refused, otherwise the Worker is removed automatically.
name: Menapoly Cue pilot (manual, approval required)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: [check, provision, deploy, rollback]
        default: check
      confirm:
        description: "Type the phrase for this action exactly"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: menapoly-cue-pilot
  cancel-in-progress: false

jobs:
  gate:
    name: Gate (pilot branch + typed phrase)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check branch and confirmation phrase
        env:
          REF: ${{ github.ref }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          if [ "$REF" != "refs/heads/menapoly-cue-2.0" ]; then
            echo "::error::This workflow only runs from the menapoly-cue-2.0 branch (got $REF)."; exit 1
          fi
          case "$ACTION" in
            check)     want="check the pilot" ;;
            provision) want="I approve creating the pilot resources" ;;
            deploy)    want="I approve deploying the Menapoly Cue pilot" ;;
            rollback)  want="I approve removing the pilot Worker" ;;
            *) echo "::error::Unknown action"; exit 1 ;;
          esac
          if [ "$CONFIRM" != "$want" ]; then
            echo "::error::The confirmation phrase doesn't match '$ACTION'. Nothing was run."; exit 1
          fi
          echo "Gate passed for: $ACTION"

  pilot:
    name: ${{ inputs.action }} (after owner approval)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: menapoly-cue-pilot
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELAY_ACTIONS_TOKEN: ${{ secrets.RELAY_ACTIONS_TOKEN }}
      CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
      CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
      OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Refuse anything but the pilot branch (again, inside the protected job)
        env:
          REF: ${{ github.ref }}
        run: '[ "$REF" = "refs/heads/menapoly-cue-2.0" ] || { echo "::error::wrong branch"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: menapoly-cue-2.0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install tools (exact versions from the lockfile)
        working-directory: cloud/control-plane
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --quiet "httpx==0.28.1"
      - name: Typecheck and unit tests (includes the pilot config guard)
        working-directory: cloud/control-plane
        run: |
          npx tsc --noEmit
          npm test
      - name: Check (read-only)
        if: inputs.action == 'check'
        run: python cloud/control-plane/pilot/preflight.py --ci --stage before-provision
      - name: Provision D1, private R2 and queues
        if: inputs.action == 'provision'
        run: python cloud/control-plane/pilot/ci.py provision
      - name: Deploy (gate → deploy with secrets → probe → auto-remove on failure)
        if: inputs.action == 'deploy'
        run: python cloud/control-plane/pilot/ci.py deploy
      - name: Remove the pilot Worker
        if: inputs.action == 'rollback'
        run: python cloud/control-plane/pilot/ci.py rollback
